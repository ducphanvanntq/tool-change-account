[package]
name = "rust-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.35", features = ["bundled"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
colored = "3"
